name: drive-clips
on:
  push:
    paths: ['requests/drive.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and compress Drive videos
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip -q install gdown
          mkdir -p clips
          while read -r id start dur name; do
            [ -z "$id" ] && continue
            case "$id" in \#*) continue;; esac
            [ -f "clips/$name.mp4" ] && continue
            gdown -q "https://drive.google.com/uc?id=$id" -O /tmp/src.mp4 || { echo "fail $id"; continue; }
            ffmpeg -y -loglevel error -ss "${start:-0}" -t "${dur:-20}" -i /tmp/src.mp4 \
              -vf "scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1080,-2)',fps=30" \
              -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 96k -movflags +faststart "clips/$name.mp4"
            ffmpeg -y -loglevel error -ss 1 -i "clips/$name.mp4" -frames:v 1 -vf scale=360:-1 "clips/$name.jpg"
            rm -f /tmp/src.mp4
          done < requests/drive.txt
          ls -la clips
      - name: Commit
        run: |
          git config user.name "drive-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clips
          git commit -m "Add clips from Drive" || echo "nothing to commit"
          git push
