name: drive-clips
on:
  push:
    branches: [main]
    paths: ['clips/request.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Process
        run: |
          set -e
          mkdir -p work out
          REQ=$(head -1 clips/request.txt | tr -d '\r')
          # lines after the first: "<mode> <driveId> [start] [dur]"  mode = sheet | cut
          tail -n +2 clips/request.txt | while read -r MODE ID S D; do
            [ -z "$ID" ] && continue
            f="work/$ID.mp4"
            if [ ! -f "$f" ]; then
              curl -sL --retry 3 -o "$f" "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" || true
            fi
            if ! ffprobe -v error "$f" >/dev/null 2>&1; then echo "$ID FAILED" >> out/log.txt; continue; fi
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            if [ "$MODE" = "sheet" ]; then
              n=0; for p in 0.1 0.3 0.5 0.7 0.9; do n=$((n+1)); t=$(python3 -c "print($DUR*$p)"); ffmpeg -nostdin -v error -y -ss $t -i "$f" -frames:v 1 -vf "scale=-2:360" work/${ID}_$n.jpg; done
              ffmpeg -nostdin -v error -y -i work/${ID}_1.jpg -i work/${ID}_2.jpg -i work/${ID}_3.jpg -i work/${ID}_4.jpg -i work/${ID}_5.jpg -filter_complex "[0][1][2][3][4]hstack=5" -frames:v 1 -q:v 5 "out/sheet_$ID.jpg"
              echo "$ID dur=$DUR" >> out/log.txt
            else
              ffmpeg -nostdin -v error -y -ss ${S:-0} -t ${D:-8} -i "$f" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" -c:v libx264 -preset medium -crf 23 -an -movflags +faststart "out/cut_${ID}_${S:-0}.mp4"
              echo "$ID cut ${S:-0}+${D:-8} dur=$DUR" >> out/log.txt
            fi
          done
          # encrypt everything with a random key, key encrypted to the public key
          mkdir -p enc/$REQ
          openssl rand -out k.bin 32
          openssl pkeyutl -encrypt -pubin -inkey .github/clips_pub.pem -in k.bin -out enc/$REQ/key.enc
          for x in out/*; do openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k.bin -in "$x" -out "enc/$REQ/$(basename $x).enc"; done
          rm -f k.bin
      - name: Commit results to clips-out branch
        run: |
          REQ=$(head -1 clips/request.txt | tr -d '\r')
          git config user.name "clips-bot"; git config user.email "clips-bot@users.noreply.github.com"
          mv enc /tmp/enc
          git fetch origin clips-out || true
          if git rev-parse --verify origin/clips-out >/dev/null 2>&1; then git checkout -B clips-out origin/clips-out; else git checkout --orphan clips-out; git rm -rf -q . ; fi
          mkdir -p enc && cp -r /tmp/enc/* enc/
          git add enc && git commit -q -m "clips $REQ" && git push -q origin clips-out
