name: indexnow
# Tells Bing (and other IndexNow engines) about new or changed pages.
# Runs automatically after every push to main that changes site/, and can be run by hand
# (Actions > indexnow > Run workflow) to submit every URL in the sitemap.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://amit-tobi.onrender.com
      KEY: be24c350d791d0b25c2e50f739dd2be6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect URLs
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' > urls.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'site/**/index.html' 'site/index.html' 2>/dev/null \
              | sed -e 's#^site/##' -e 's#index\.html$##' -e "s#^#$BASE/#" > urls.txt || true
            # new or changed pages only; skip the bulk case of a full rebuild touching everything
            if [ "$(wc -l < urls.txt)" -gt 40 ]; then
              git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- 'site/**/index.html' \
                | sed -e 's#^site/##' -e 's#index\.html$##' -e "s#^#$BASE/#" > urls.txt
              echo "$BASE/articles/" >> urls.txt
            fi
          fi
          sort -u urls.txt -o urls.txt
          echo "URLs:"; cat urls.txt
      - name: Wait for Render deploy
        if: github.event_name == 'push'
        run: |
          U=$(head -1 urls.txt); [ -z "$U" ] && exit 0
          for i in $(seq 1 30); do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$U"); echo "try $i: $c"
            [ "$c" = "200" ] && exit 0; sleep 20
          done
          echo "page not live yet, submitting anyway"
      - name: Submit
        run: |
          [ -s urls.txt ] || { echo "nothing to submit"; exit 0; }
          python3 - <<'PY'
          import json,os,urllib.request
          urls=[u.strip() for u in open("urls.txt") if u.strip()]
          body=json.dumps({"host":"amit-tobi.onrender.com","key":os.environ["KEY"],
                           "keyLocation":os.environ["BASE"]+"/"+os.environ["KEY"]+".txt","urlList":urls}).encode()
          out=[]
          for ep in ["https://api.indexnow.org/indexnow","https://www.bing.com/indexnow"]:
              req=urllib.request.Request(ep,data=body,headers={"Content-Type":"application/json; charset=utf-8"})
              try:
                  r=urllib.request.urlopen(req,timeout=30); out.append(f"{ep}: {r.status}")
              except urllib.error.HTTPError as e:
                  out.append(f"{ep}: {e.code} {e.read()[:200]!r}")
          print("\n".join(out))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### IndexNow\n"+"\n".join("- "+u for u in urls)+"\n\n"+"\n".join("- "+o for o in out)+"\n")
          PY
